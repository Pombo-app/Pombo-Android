<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script>
// Installed BEFORE the vendor bundle (its loggers capture console.* at load).
// onConsoleMessage only sees the first argument's toString(), so an object
// logged by the SDK reaches logcat as "[object Object]" — flatten everything
// to one JSON line instead. Debugging aid only; no behaviour change.
(function () {
    function flat(a) {
        if (a instanceof Error) return a.stack || (a.name + ': ' + a.message);
        if (typeof a === 'object' && a !== null) {
            try { return JSON.stringify(a); } catch (e) { return String(a); }
        }
        return String(a);
    }
    ['error', 'warn'].forEach(function (level) {
        const orig = console[level].bind(console);
        console[level] = function () {
            orig(Array.prototype.map.call(arguments, flat).join(' '));
        };
    });
})();
</script>
<!-- Web-app bundle (Streamr SDK + ethers + qrcode) served from assets via
     shouldInterceptRequest — identical versions to the Pombo web. -->
<script src="pombo-vendor.bundle.js"></script>
</head>
<body>
<script>
'use strict';

// Tokens substituted by Kotlin before load (empty = no identity yet). The
// private key never enters this page: every signature is delegated to the
// native oracle (Native.signMessagePayload / Native.signTransactionPayload).
const BRIDGE_ADDRESS = '__BRIDGE_ADDR__';
const BRIDGE_PUBKEY = '__BRIDGE_PUB__';

// Polygon RPCs. The user's preference (Settings → API) is injected by Kotlin;
// when nothing is injected we fall back to the endpoints that answer CORS in
// a WebView (origin https://pombo.local) — some (e.g. meowrpc) don't send the
// headers and spam the console. Kotlin already appends these safe ones after
// the chosen preset, so a CORS-broken pick still falls through to a working
// endpoint instead of killing the connection.
let BRIDGE_RPCS = [];
try { BRIDGE_RPCS = JSON.parse('__BRIDGE_RPCS__'); } catch (e) { /* not injected */ }
const DEFAULT_RPCS = [
    'https://polygon.drpc.org',
    'https://polygon-bor-rpc.publicnode.com',
    'https://rpc.ankr.com/polygon'
];
const RPCS = (Array.isArray(BRIDGE_RPCS) && BRIDGE_RPCS.length ? BRIDGE_RPCS : DEFAULT_RPCS)
    .map(function (url) { return { url: url }; });

// Ethereum mainnet RPCs for ENS reverse lookup (same list as the web config).
const ENS_RPCS = [
    'https://ethereum-rpc.publicnode.com',
    'https://eth.drpc.org',
    'https://cloudflare-eth.com'
];
// K-anonymity decoys per reverse lookup (web CONFIG.identity.ensDecoyCount).
// Kept at 2 because the free ENS tiers 429 easily: cover fires once per
// resolution, but a null result still walks all providers, so the ceiling is
// N+numProviders requests.
const ENS_DECOY_COUNT = 2;
let ensProviders = null;

let client = null;   // StreamrClient (only with an identity)
let wallet = null;   // { address, publicKey } of the active identity — never the key
const subs = new Map();       // 'streamId|partition' -> subscription
const pubChains = new Map();  // 'streamId|partition' -> promise chain (publish order)
// 'streamId|partition' -> channel password, for BINARY payloads only (see
// api.subscribe). Held here rather than passed per message because a
// subscription callback has no other way to learn which channel it belongs to.
const subPasswords = new Map();
// The Streamr-layer DM key (the fixed 'pombo-dm-v1' group key), the per-peer
// key registry and the decrypt recovery are GONE — removed together with the
// web's P6 cleanup. Everything Pombo publishes on DM streams now goes out
// with EncryptionType.NONE under a throwaway identity, sealed at the app
// layer (sealed sender v2); a DECRYPT_ERROR on a subscription is foreign
// traffic or pre-migration history and there is no key left to add for it.
// Push wake-signal constants (web CONFIG.push). tagBytes=1 keeps 256 possible
// tags, which is what gives K-anonymity while the user base is small.
const PUSH_TAG_BYTES = 1;
const PUSH_POW_DIFFICULTY = 4;
const PUSH_POW_MAX_MS = 15000;

// ---- base64 <-> UTF-8 ----
function b64ToUtf8(b64) {
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(u8);
}
function utf8ToB64(s) {
    const u8 = new TextEncoder().encode(s);
    let bin = '';
    for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
    return btoa(bin);
}
function subKey(streamId, partition) { return streamId + '|' + partition; }

// ---- binary <-> base64 (media data on -2/P2) ----
// JSON cannot carry bytes: a Uint8Array put through JSON.stringify comes out
// as {"0":12,"1":255,…} — roughly 6x the size and an object, not bytes, on the
// far side. Every binary payload crosses this bridge as base64 instead.
function b64ToU8(b64) {
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
}
// Chunked at 0x8000: String.fromCharCode.apply spreads the array into
// arguments, so a whole 240 KB piece in one call overflows the stack.
function u8ToB64(u8) {
    let s = '';
    const CH = 0x8000;
    for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    return btoa(s);
}
// ---- password-channel crypto for binary payloads ----
//
// Same wire format as web crypto.js encryptBinary/decryptBinary: the raw bytes
// salt[16] || iv[12] || AES-GCM ciphertext+tag. NOT base64 — unlike the JSON
// path, a binary payload stays binary on the wire.
//
// This lives here rather than in Kotlin for the reason already documented on
// pwDecryptBatch: PBKDF2-310k through Bouncy Castle costs ~1s per call on a
// phone, while Chromium runs it in native BoringSSL. At one derivation per
// piece the Kotlin route would spend minutes of CPU on a single file.
const PW_ITERATIONS = 310000;
const PW_KEY_CACHE_MAX = 10;
const pwKeyCache = new Map(); // 'password|saltHex' -> Promise<CryptoKey> (LRU)

// PERFORMANCE NOTE — worth revisiting.
// Both this cache and the web's (crypto.js getCachedKey) are keyed by
// password AND salt, and every encrypt generates a FRESH RANDOM salt. So for
// outgoing pieces the cache never hits, and for incoming ones it only hits if
// the sender happened to reuse a salt. Every single piece therefore pays a
// full 310k-iteration derivation on both sides.
//
// The fix is for a sender to derive ONE salt per file and reuse it across that
// file's pieces, keeping the IV random per piece. That is wire-compatible
// (nothing in the format demands a unique salt) and cryptographically sound:
// what must never repeat under one key is the IV, not the salt, and a per-file
// random salt still blocks precomputation across channels. It would make the
// cache hit for every piece after the first and cut key derivation to once per
// file, on both sides.
//
// Not done yet because it changes the WEB's publish path too, and both ends
// must agree before it is worth anything. See MediaController.kt.
async function pwDeriveKey(password, salt) {
    let saltHex = '';
    for (let i = 0; i < salt.length; i++) saltHex += salt[i].toString(16).padStart(2, '0');
    const cacheKey = password + '|' + saltHex;
    const hit = pwKeyCache.get(cacheKey);
    if (hit) {
        // Re-insert so the Map's insertion order stays the LRU order.
        pwKeyCache.delete(cacheKey);
        pwKeyCache.set(cacheKey, hit);
        return hit;
    }
    const promise = (async function () {
        const km = await crypto.subtle.importKey(
            'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: PW_ITERATIONS, hash: 'SHA-256' },
            km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    })();
    pwKeyCache.set(cacheKey, promise);
    // A rejected derivation must not be cached, or the failure is permanent.
    promise.catch(function () { pwKeyCache.delete(cacheKey); });
    if (pwKeyCache.size > PW_KEY_CACHE_MAX) {
        pwKeyCache.delete(pwKeyCache.keys().next().value);
    }
    return promise;
}

async function pwEncryptBinary(data, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await pwDeriveKey(password, salt);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, data));
    const out = new Uint8Array(16 + 12 + ct.length);
    out.set(salt, 0);
    out.set(iv, 16);
    out.set(ct, 28);
    return out;
}

// Text/JSON variants of the same scheme, for the media SIGNAL partition.
// Wire form is base64(salt||iv||ct) — a JSON string on the wire, exactly what
// PomboCrypto.encryptString and web cryptoManager.encrypt produce.
//
// These exist so signals stop paying Bouncy Castle's ~1s PBKDF2 in Kotlin.
// One signal per file would not matter; one piece_request PER PIECE does —
// a 113 MB file is ~512 pieces, which is over eight minutes of key derivation
// spent only on ASKING for the data.
async function pwEncryptString(plaintext, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await pwDeriveKey(password, salt);
    const ct = new Uint8Array(await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(plaintext)));
    const out = new Uint8Array(16 + 12 + ct.length);
    out.set(salt, 0);
    out.set(iv, 16);
    out.set(ct, 28);
    return u8ToB64(out);
}

async function pwDecryptString(b64, password) {
    const u8 = b64ToU8(b64);
    if (u8.length < 28 + 16) throw new Error('payload too short to be encrypted');
    const key = await pwDeriveKey(password, u8.slice(0, 16));
    const pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: u8.slice(16, 28) }, key, u8.slice(28));
    return new TextDecoder().decode(pt);
}

async function pwDecryptBinary(buf, password) {
    // 28 bytes of header and a GCM tag of 16: anything shorter cannot be a
    // valid payload, and slicing it would hand AES-GCM nonsense to reject
    // slowly instead of rejecting it here.
    if (buf.length < 28 + 16) throw new Error('binary payload too short to be encrypted');
    const key = await pwDeriveKey(password, buf.slice(0, 16));
    const plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28));
    return new Uint8Array(plain);
}

// The SDK may hand back a Uint8Array, an ArrayBuffer or a Buffer-like view
// depending on the path; returns null for anything that is not bytes, which is
// how the subscribe callback tells binary from JSON.
function asU8(content) {
    if (content instanceof Uint8Array) return content;
    if (content instanceof ArrayBuffer) return new Uint8Array(content);
    if (content && content.buffer instanceof ArrayBuffer && typeof content.byteLength === 'number') {
        return new Uint8Array(content.buffer, content.byteOffset || 0, content.byteLength);
    }
    return null;
}

// ---- API exposed to Kotlin via bridgeCall ----
const api = {

    // ===== ethers (identity) — work without a connected client =====

    async createWallet() {
        const w = window.ethers.Wallet.createRandom();
        return { address: w.address, privateKey: w.privateKey, mnemonic: w.mnemonic ? w.mnemonic.phrase : null };
    },

    async walletFromPrivateKey(a) {
        const w = new window.ethers.Wallet(String(a.privateKey).trim());
        return { address: w.address, privateKey: w.privateKey };
    },

    async walletFromMnemonic(a) {
        const w = window.ethers.Wallet.fromPhrase(String(a.phrase).trim());
        return { address: w.address, privateKey: w.privateKey };
    },

    // Verifies the Pombo canonical hash: keccak256(utf8(data)) -> personal_sign recovery.
    // Byte-compatible with identityManager.createMessageHash + authManager.signMessage.
    async verifyCanonical(a) {
        const hash = window.ethers.keccak256(window.ethers.toUtf8Bytes(a.data));
        const address = window.ethers.verifyMessage(hash, a.signature);
        return { address: address };
    },

    // ===== Streamr (transport) =====

    // `a.password` (optional) encrypts the payload here instead of in Kotlin.
    // Only the media signal partition passes it — every other caller keeps
    // sealing in PomboCrypto and hands us the finished string, so nothing else
    // changes behaviour. The reason is the same one behind pwDecryptBatch:
    // BoringSSL, not Bouncy Castle, on a path that runs once per piece.
    async publish(a) {
        if (!client) throw new Error('client not connected');
        const key = subKey(a.streamId, a.partition);
        const content = a.password
            ? await pwEncryptString(JSON.stringify(a.content), String(a.password))
            : a.content;
        const prev = pubChains.get(key) || Promise.resolve();
        const next = prev.catch(function () {}).then(function () {
            return client.publish({ streamId: a.streamId, partition: a.partition }, content);
        });
        pubChains.set(key, next);
        const msg = await next;
        // The network-assigned timestamp — the storage-file announce confirm loop
        // matches the published announce against stored rows by timestamp. Shapes
        // vary across SDK versions; fall back to null (caller uses local time).
        var ts = null;
        if (msg && typeof msg.timestamp === 'number') ts = msg.timestamp;
        else if (msg && msg.streamMessage && typeof msg.streamMessage.getTimestamp === 'function') ts = msg.streamMessage.getTimestamp();
        return { ok: true, timestamp: ts };
    },

    // ===== publishAs — publish under an identity that is not the client's =====
    //
    // Mirror of web streamr.js publishAs(). client.publish() bakes in two
    // things the privacy migration must override: it derives publisherId from
    // the client identity (the social-graph leak), and its MessageFactory
    // forces EncryptionType.AES on any stream that is not public-subscribe,
    // dragging the group-key exchange back in. Building the StreamMessage by
    // hand sidesteps both; encryption stays at the app layer.
    //
    // ⚠️ getNode() is @deprecated/@hidden in the SDK — exported and typed, but
    // with no stability guarantee. The SDK version is pinned by the vendor
    // bundle; re-run the smoke test after any bundle refresh.
    //
    // identity: an EthereumKeyPairIdentity. data: Uint8Array (published as-is)
    // or a JSON-able object. opts: { publisherId, signatureType, msgChainId,
    // timestamp }.
    async _publishAs(identity, streamId, partition, data, opts) {
        if (!client) throw new Error('client not connected');
        opts = opts || {};
        const MessageID = window.MessageID, MessageSigner = window.MessageSigner;
        if (!MessageID || !MessageSigner) {
            throw new Error('SDK message primitives not exposed — refresh pombo-vendor.bundle.js');
        }

        const isBinary = data instanceof Uint8Array;
        const content = isBinary ? data : new TextEncoder().encode(JSON.stringify(data));

        const messageId = new MessageID(
            streamId,
            partition,
            opts.timestamp != null ? opts.timestamp : Date.now(),
            0,
            opts.publisherId != null ? opts.publisherId : await identity.getUserId(),
            opts.msgChainId != null ? opts.msgChainId : api._randomHex(10)
        );

        const message = await new MessageSigner(identity).createSignedMessage({
            messageId: messageId,
            content: content,
            contentType: isBinary ? window.ContentType.BINARY : window.ContentType.JSON,
            // Never AES: the app already encrypts what needs encrypting, and
            // the SDK's own layer would need a group key per publisher.
            encryptionType: window.EncryptionType.NONE,
            messageType: window.StreamMessageType.MESSAGE
        }, opts.signatureType != null ? opts.signatureType : identity.getSignatureType());

        const node = client.getNode();
        const streamPartId = messageId.getStreamPartID();

        // join() only registers interest — it does not guarantee anyone is
        // connected, and broadcasting into an empty room reaches storage but
        // no live subscriber. Wait for one neighbour; on timeout publish
        // anyway (best-effort — a cold-node message can still reach storage).
        // This matters most for DMs: a peer's inbox we never subscribe to has
        // no standing topology.
        try {
            await node.join(streamPartId, { minCount: 1, timeout: 5000 });
        } catch (e) {
            console.warn('publishAs: no neighbours on ' + streamPartId + ' yet (' +
                (e && e.message || e) + ') — publishing anyway');
        }

        await node.broadcast(message);

        // Expose .timestamp the way client.publish() does, ONCE, at the
        // source. A StreamMessage only has getTimestamp()/messageId.timestamp;
        // callers that read .timestamp would get undefined and silently
        // conclude nothing was published (web hit this three times).
        try { message.timestamp = messageId.timestamp; } catch (e) { /* frozen: callers fall back */ }
        return message;
    },

    _randomHex(nBytes) {
        const u8 = crypto.getRandomValues(new Uint8Array(nBytes));
        let s = '';
        for (let i = 0; i < u8.length; i++) s += u8[i].toString(16).padStart(2, '0');
        return s;
    },

    // ===== envelope signer recovery (N-C, web envelopeSigner.js) =====
    //
    // In a gated channel every member publishes as the gate clone, so the
    // on-wire publisherId names the CONTRACT. The author is whoever signed
    // the Streamr envelope — the SDK validated that signature against the
    // gate's isValidSignature (ERC-1271) before the message reached us, so
    // recovering it yields an address the chain already vouched for.
    //
    // Digest reconstruction mirrors the SDK's createSignaturePayload for
    // MESSAGE-type messages (v103; parity locked by web-generated vectors in
    // docs/GATED-CHANNELS-envelope-vectors.json):
    //   payload = utf8(streamId+partition+timestamp+seqNo+publisherId+
    //             msgChainId[+prevTs+prevSeq]) || content bytes
    //   digest  = EIP-191 ("\x19Ethereum Signed Message:\n" + len)
    //
    // ⚠️ The public Message wrapper (subscribe callbacks AND resend
    // iterators) hides the raw StreamMessage in `.streamMessage` — recovery
    // on the wrapper itself fails for every message.
    _signerCache: new Map(),

    _recoverEnvelopeSigner(message) {
        try {
            const sm = (message && message.streamMessage) ? message.streamMessage : message;
            const id = sm && sm.messageId;
            const content = sm && sm.content;
            const signature = sm && sm.signature;
            if (!id || !(content instanceof Uint8Array) ||
                !(signature instanceof Uint8Array) || signature.length !== 65) return null;

            const prev = sm.prevMsgRef;
            const header = '' + id.streamId + id.streamPartition + id.timestamp +
                id.sequenceNumber + id.publisherId + id.msgChainId +
                (prev ? ('' + prev.timestamp + prev.sequenceNumber) : '');
            const headerBytes = new TextEncoder().encode(header);
            const payload = new Uint8Array(headerBytes.length + content.length);
            payload.set(headerBytes, 0);
            payload.set(content, headerBytes.length);

            const digest = window.ethers.hashMessage(payload);
            const sigHex = window.ethers.hexlify(signature);
            // Keyed by digest+signature: the pair fully determines the result,
            // so re-attached signatures can never poison the cache.
            const cacheKey = digest + sigHex;
            const cached = api._signerCache.get(cacheKey);
            if (cached !== undefined) return cached;

            const signer = window.ethers.recoverAddress(digest, sigHex).toLowerCase();
            if (api._signerCache.size >= 500) {
                api._signerCache.delete(api._signerCache.keys().next().value);
            }
            api._signerCache.set(cacheKey, signer);
            return signer;
        } catch (e) {
            return null;
        }
    },

    // Streams whose publish rights are on-chain and owner/member-bound must
    // never see an ephemeral publisher: the admin stream (-3: ADMIN_STATE,
    // CHANNEL_IMAGE, PASSWORD_CHALLENGE) is refused HERE, loudly — a clever
    // fallback would produce a message the network validates and receivers
    // reject as a non-owner. Gated channels are refused by the Kotlin
    // routing, which is the layer that knows the channel kind.
    _refuseAdminStream(streamId) {
        if (/-3$/.test(String(streamId))) {
            throw new Error('publishAs refuses the admin stream (' + streamId +
                '): an ephemeral key holds no on-chain permission');
        }
    },

    // ===== per-channel ephemeral publishing identity (web channelIdentity.js) =====
    //
    // ONE KEY PER CHANNEL, not per message: inside a channel the pseudonym
    // hides nothing from members, who read the proof anyway. Its job is to
    // stop a network observer — who sees publisherId on every message without
    // joining anything — from stitching a social graph. ONE KEY PER CHANNEL,
    // not per account: two channels must not be tied together by publisher.
    //
    // NEVER PERSISTED: lives here, dies with the page (the WebView reloads on
    // identity switch). Rotation happens when the channel is genuinely LEFT
    // (Kotlin calls dropChannelIdentity from the leave path), never on a view
    // switch — peers mid-transfer know the current publisher.
    _channelIdentities: {},

    // All three streams of a channel (-1/-2/-3) share one identity.
    _baseChannelId(streamId) {
        return String(streamId).replace(/-[123]$/, '');
    },

    // Kotlin mints the channel pseudonym natively (ChannelIdentities) and
    // hands the entry in with the publish; the page only caches it so the
    // chunk publishes reuse the same pseudonym as the announce.
    _channelIdentity(streamId, provided) {
        const key = api._baseChannelId(streamId);
        if (provided && provided.identityPk) {
            api._channelIdentities[key] = {
                identityPk: String(provided.identityPk),
                publisherId: String(provided.publisherId),
                proof: String(provided.proof)
            };
        }
        const existing = api._channelIdentities[key];
        if (!existing) throw new Error('no channel identity for ' + streamId);
        return existing;
    },

    async dropChannelIdentity(a) {
        delete api._channelIdentities[api._baseChannelId(a.streamId)];
        return { ok: true };
    },

    // Fields that must never reach the wire (web publisherProof.js
    // stripLocalFields): local UI state, and the identity fields D6/D7
    // removed — `sender`/`account` beside an ephemeral publisher would undo
    // the whole migration; `signature` is the app-layer signature that no
    // longer travels; `channelId` is redundant with the Streamr MessageID.
    _stripLocalFields(data) {
        const out = {};
        for (var k in data) {
            if (k === 'verified' || k === 'pending' || k === '_dmSent' ||
                k === 'sender' || k === 'account' || k === 'signature' || k === 'channelId') continue;
            out[k] = data[k];
        }
        return out;
    },

    // Publish channel traffic under the channel's ephemeral identity, with
    // the proof INSIDE the payload — sealed by the channel password when
    // there is one, in the clear (deliberately) on a public channel.
    //
    // THE single place where "who we appear to be" on a channel is decided.
    // Kotlin routes every public/password channel publish through here;
    // gated channels and the admin stream keep the account/clone (on-chain
    // permission that a throwaway key does not hold).
    //   { streamId, partition, content, password? } -> { ok, timestamp }
    async publishAsChannel(a) {
        api._refuseAdminStream(a.streamId);
        const entry = api._channelIdentity(a.streamId, a.identity);
        const payload = api._stripLocalFields(a.content);
        payload.proof = entry.proof;
        // A password-sealed payload goes out as a JSON STRING (base64), same
        // as api.publish — NOT as binary content. Pre-encoding it here flagged
        // ContentType.BINARY and receivers routed it to the piece path.
        const wire = a.password
            ? await pwEncryptString(JSON.stringify(payload), String(a.password))
            : payload;
        const identity = window.EthereumKeyPairIdentity.fromPrivateKey(entry.identityPk);
        // NO publisherId override — the MessageID takes identity.getUserId(),
        // exactly like the web and the smoke test. Passing the wallet-derived
        // CHECKSUMMED address here made every receiver's signature validation
        // reject the message: recovered (lowercase) != publisherId (mixed
        // case), and the whole channel went silent without one error.
        const msg = await api._publishAs(identity, a.streamId, a.partition, wire);
        return { ok: true, timestamp: msg.timestamp };
    },

    // Publish AS THE ACCOUNT with encryptionType NONE — the gated admin
    // stream's epoch envelopes (N-A): the owner-only publish permission is
    // on-chain, so the account must sign; but client.publish would force the
    // SDK's AES + group-key exchange on a members-only stream — exactly the
    // per-publisher, publisher-must-be-online dependency the epoch protocol
    // replaces. Content is already sealed (or public protocol data) when it
    // gets here.
    //   { streamId, partition, content } -> { ok, timestamp }
    async publishAsAccount(a) {
        if (!wallet) throw new Error('no identity');
        const identity = nativeIdentity;
        const msg = await api._publishAs(identity, a.streamId, a.partition, a.content);
        return { ok: true, timestamp: msg.timestamp };
    },

    // Publish AS THE GATE CLONE (N-C gated channels): the ACCOUNT key signs
    // the envelope, the clone is the on-wire publisher, and the network
    // validates via the clone's isValidSignature (ERC-1271). Receivers
    // recover authorship from that signature (_recoverEnvelopeSigner).
    // Allowed on -3 on purpose: in a gated channel the clone holds the only
    // publish grant, and owner-only authority moved to ingest (Kotlin drops
    // -3 messages whose SIGNER is not the namespace admin).
    //   { streamId, partition, content, gateAddress } -> { ok, timestamp }
    async publishAsGate(a) {
        if (!wallet) throw new Error('no identity');
        if (!a.gateAddress) throw new Error('publishAsGate requires gateAddress');
        const st = window.SignatureType;
        if (!st || st.ERC_1271 == null) {
            throw new Error('SignatureType.ERC_1271 not exposed — refresh pombo-vendor.bundle.js');
        }
        const identity = nativeIdentity;
        const msg = await api._publishAs(identity, a.streamId, a.partition, a.content, {
            // LOWERCASE, always — Trap 4: a checksummed publisherId makes every
            // receiver's signature validation reject the message in silence.
            publisherId: String(a.gateAddress).toLowerCase(),
            signatureType: st.ERC_1271
        });
        return { ok: true, timestamp: msg.timestamp };
    },

    // Seal a push REGISTRATION to the relay's static key and publish it under
    // the sealing ephemeral (§9.1 #3) — the endpoint/FCM token never crosses
    // the observable stream in the clear, and the envelope names no account.
    // PIN (mirror of the DM peer-key pin, §9.1 #2): computeAddress(pk) must
    // be the configured relay — tampered metadata is rejected, never a MITM.
    // Same construction as the web's dmCrypto.sealToPublicKey: AES-GCM key =
    // HKDF-SHA256(X of ECDH(eph, relayPk), salt 'pombo-push-sealed-v1').
    //   { streamId, content, pk, relayAddress } -> { ok, timestamp }
    async pushSealAndPublish(a) {
        const eth = window.ethers;
        if (eth.computeAddress(a.pk).toLowerCase() !== String(a.relayAddress).toLowerCase()) {
            throw new Error('relay key pin failed: metadata key does not recover the configured relay');
        }
        const ephemeralPrivateKey = '0x' + api._randomHex(32);
        const sk = new eth.SigningKey(ephemeralPrivateKey);
        const shared = eth.getBytes(sk.computeSharedSecret(a.pk)).slice(1, 33);
        const km = await crypto.subtle.importKey('raw', shared, { name: 'HKDF' }, false, ['deriveKey']);
        const aes = await crypto.subtle.deriveKey(
            {
                name: 'HKDF', hash: 'SHA-256',
                salt: new TextEncoder().encode('pombo-push-sealed-v1'),
                info: new TextEncoder().encode('aes-256-gcm')
            },
            km, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv }, aes,
            new TextEncoder().encode(JSON.stringify(a.content)));
        const envelope = {
            type: 'sealed', v: 1, epk: sk.compressedPublicKey,
            ct: u8ToB64(new Uint8Array(ct)), iv: u8ToB64(iv)
        };
        const identity = window.EthereumKeyPairIdentity.fromPrivateKey(ephemeralPrivateKey);
        const msg = await api._publishAs(identity, a.streamId, 0, envelope);
        return { ok: true, timestamp: msg.timestamp };
    },

    // Kotlin-facing wrapper: publish under a random (or given) ephemeral key.
    //   { streamId, partition, content, privateKey? }
    //   -> { ok, timestamp, publisherId }
    // Binary goes through bridgePublishBinary/bridgePublishStorageChunk,
    // which hand the bytes over outside the JSON envelope.
    async publishAs(a) {
        api._refuseAdminStream(a.streamId);
        const pk = a.privateKey || ('0x' + api._randomHex(32));
        const identity = window.EthereumKeyPairIdentity.fromPrivateKey(pk);
        const msg = await api._publishAs(identity, a.streamId, a.partition, a.content);
        return {
            ok: true,
            timestamp: msg.timestamp,
            publisherId: String(msg.messageId.publisherId)
        };
    },

    // `a.password` is used ONLY for binary payloads (-2/P2 pieces), which are
    // unwrapped in the callback below. JSON messages keep being decrypted in
    // Kotlin (PomboCrypto) as before — they are low-rate and already work, and
    // moving them would be a behaviour change for every existing flow.
    async subscribe(a) {
        if (!client) throw new Error('client not connected');
        const key = subKey(a.streamId, a.partition);
        if (a.password) subPasswords.set(key, String(a.password));
        // Idempotent, which is what lets Kotlin call ensureMediaPartitions
        // freely without keeping its own registry of what is open. The password
        // is still refreshed above, so re-subscribing can correct it.
        if (subs.has(key)) return { ok: true, already: true };
        const subscribeArgs = { streamId: a.streamId, partition: a.partition };
        // Gated channels (N-C): prove access via the gate contract — our
        // wallet signs, the clone's isValidSignature vouches. No per-member
        // stream grant exists.
        if (a.erc1271Contract) subscribeArgs.erc1271Contract = String(a.erc1271Contract).toLowerCase();
        const sub = await client.subscribe(subscribeArgs, function (content, meta) {
            try {
                // Publisher identity the way web streamr.js reads it:
                // getPublisherId() FIRST, the bare property only as fallback.
                // The two are not always the same value, and the difference is
                // not cosmetic — media transfers address a named seeder, so a
                // wrong publisher id makes every piece_request name a peer that
                // is not the one holding the file, and every request is ignored.
                var pid = null;
                try {
                    if (meta && typeof meta.getPublisherId === 'function') pid = meta.getPublisherId();
                    else if (meta && meta.publisherId != null) pid = meta.publisherId;
                } catch (e) { pid = (meta && meta.publisherId) || null; }
                if (pid != null && meta && meta.publisherId != null &&
                    String(pid).toLowerCase() !== String(meta.publisherId).toLowerCase()) {
                    console.warn('publisherId mismatch on ' + a.streamId + '#' + a.partition +
                        ': getPublisherId=' + pid + ' property=' + meta.publisherId);
                }
                const metaOut = {
                    publisherId: pid != null ? String(pid) : null,
                    timestamp: meta ? meta.timestamp : null,
                    sequenceNumber: meta ? meta.sequenceNumber : null
                };
                // Gated (N-C): authorship = envelope signer. Recovered here —
                // the raw StreamMessage never crosses to Kotlin — and only on
                // request (one ecrecover per message is waste on every other
                // stream). Policy (drop rules) stays in Kotlin.
                if (a.recoverSigner) {
                    metaOut.signer = api._recoverEnvelopeSigner(meta);
                }
                // Binary (file pieces on -2/P2) goes to its own callback so the
                // bytes never touch JSON.stringify. Checked first: a Uint8Array
                // IS stringifiable, so the JSON path would silently accept and
                // mangle it rather than fail.
                const bin = asU8(content);
                if (bin) {
                    // Decrypted here, not in Kotlin, and not via a follow-up
                    // bridge call: the bytes are already in this context, so
                    // doing it now avoids bouncing every piece back and forth
                    // (base64 out, base64 in) just to unwrap it.
                    const pw = subPasswords.get(key);
                    const deliver = function (u8) {
                        Native.binary(a.streamId, a.partition,
                            u8ToB64(u8),
                            utf8ToB64(JSON.stringify(metaOut)));
                    };
                    if (pw) {
                        pwDecryptBinary(bin, pw).then(function (u8) {
                            deliver(u8);
                        }, function (e) {
                            // A piece we cannot open is dropped, not delivered:
                            // handing the ciphertext up would fail its hash
                            // check and get the sender blamed as a bad seeder.
                            console.warn('binary decrypt failed on ' + a.streamId +
                                '#' + a.partition + ': ' + (e && e.message || e));
                        });
                    } else {
                        // Sealed DM pieces (0x02 on the own inbox) cross RAW:
                        // Kotlin opens them natively (SealedSenderCrypto) with
                        // the static key that never enters this page.
                        deliver(bin);
                    }
                    return;
                }
                // A password registered for THIS subscription means the payload
                // is a sealed base64 string. Only the media partitions register
                // one, so every other stream still reaches Kotlin sealed and is
                // opened there as before.
                //
                // Without this, media signals on a password channel arrived as
                // an opaque string, failed the JSONObject cast in the media
                // controller and were dropped in silence — a download would sit
                // on "looking for seeders" forever while the seeder was in fact
                // answering every single request.
                const signalPw = subPasswords.get(key);
                if (signalPw && typeof content === 'string') {
                    pwDecryptString(content, signalPw).then(function (plain) {
                        Native.message(a.streamId, a.partition,
                            utf8ToB64(plain), utf8ToB64(JSON.stringify(metaOut)));
                    }, function (e) {
                        console.warn('signal decrypt failed on ' + a.streamId + '#' +
                            a.partition + ': ' + (e && e.message || e));
                    });
                    return;
                }
                Native.message(a.streamId, a.partition,
                    utf8ToB64(JSON.stringify(content)),
                    utf8ToB64(JSON.stringify(metaOut)));
            } catch (e) { /* never let the SDK callback throw */ }
        });
        subs.set(key, sub);
        // Live decrypt failures never reach the message callback and are
        // silent without this. On DM streams they are recoverable (a first
        // message from an unknown publisher), so route them to the handler.
        try {
            if (typeof sub.on === 'function') {
                sub.on('error', function (err) { api._onSubError(err, a.streamId, a.partition); });
            }
        } catch (e) { /* older SDKs without subscription events */ }
        return { ok: true };
    },

    // A DECRYPT_ERROR used to trigger key recovery (register the fixed Pombo
    // key for the publisher and replay from storage). Nothing to recover any
    // more: every Pombo publish is EncryptionType.NONE, so an SDK-layer
    // decrypt error is foreign traffic, or DM history from before the fixed
    // key was removed — both are ignored on purpose (web P6 does the same).
    async _onSubError(err, streamId, partition) {
        try {
            var msg = err && err.message ? String(err.message) : String(err);
            console.warn('subscription error on ' + streamId + '#' + partition + ': ' + msg);
        } catch (e) { /* an error handler must never throw */ }
    },

    async unsubscribe(a) {
        const key = subKey(a.streamId, a.partition);
        subPasswords.delete(key);
        const sub = subs.get(key);
        if (sub) { subs.delete(key); await sub.unsubscribe(); }
        return { ok: true };
    },

    // Drain a resend stream the way the web's fetchHistory does: a manual
    // iterator with a per-message try/catch, skipping DECRYPT_ERROR and
    // carrying on. A `for await` loop aborts on the FIRST message it cannot
    // decrypt — and only after the SDK has waited out its group-key request to
    // the publisher — so one foreign key made a private room hang for ~30s and
    // then show nothing at all instead of the rest of its history.
    // `deadlineAt` (epoch ms) is a soft budget: when the drain overruns it —
    // key-request waits on messages from offline members are the usual cause —
    // iteration stops and whatever was already collected is RETURNED instead
    // of the whole page dying in the caller's hard timeout with nothing to
    // show. Returns true when the drain was cut short.
    // `ctx` ({streamId, partition}, optional): on DM streams a skipped
    // DECRYPT_ERROR is handed to the same recovery as live errors, so a stored
    // invite/DM from a publisher we never registered still gets replayed once
    // the fixed key is in place.
    async _drainResend(stream, push, deadlineAt, ctx) {
        const iterator = stream[Symbol.asyncIterator]();
        let done = false;
        while (!done) {
            if (deadlineAt && Date.now() > deadlineAt) {
                try { if (iterator.return) iterator.return(); } catch (e) { /* best effort */ }
                return true;
            }
            try {
                const result = await iterator.next();
                done = result.done;
                if (done) break;
                push(result.value);
            } catch (iterError) {
                if (iterError && (iterError.code === 'DECRYPT_ERROR' ||
                    (iterError.message && iterError.message.indexOf('encryption key') !== -1))) {
                    // Skip and carry on — pre-migration rows and foreign
                    // traffic; there is no key recovery any more (P6).
                    continue;
                }
                console.warn('resend iteration error: ' +
                    (iterError && iterError.message ? iterError.message : String(iterError)));
                continue;
            }
        }
        return false;
    },

    // Batch password decrypt via WebCrypto (same wire format as web crypto.js:
    // base64(salt16 || iv12 || GCM ct+tag), PBKDF2-SHA256 310k -> AES-256).
    // Kotlin's PBKDF2WithHmacSHA256 comes from Bouncy Castle in pure Java and
    // costs ~1s per message on a phone — a 50-message page took 7.5s even
    // decrypted in parallel. Chrome runs PBKDF2 in native BoringSSL, which is
    // why the PWA is fast on the same CPU; doing the page here restores that,
    // and issuing every derivation before awaiting lets Chromium's worker pool
    // overlap them. Entries that fail (wrong key, corrupt payload) return null.
    async pwDecryptBatch(a) {
        const pwKey = await api._pwKey(a.password);
        const plain = await Promise.all(a.items.map(function (b64) {
            return api._pwOpen(pwKey, b64);
        }));
        return { plain: plain };
    },

    _pwKey(password) {
        return crypto.subtle.importKey(
            'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    },

    // One sealed payload -> plaintext string, or null on any failure (wrong
    // key, corrupt payload, not actually sealed).
    async _pwOpen(pwKey, b64) {
        try {
            const bin = atob(b64);
            const u8 = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
            const salt = u8.slice(0, 16), iv = u8.slice(16, 28), ct = u8.slice(28);
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 310000, hash: 'SHA-256' },
                pwKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
            return new TextDecoder().decode(pt);
        } catch (e) { return null; }
    },

    // Opens sealed rows AS THEY ARRIVE off the resend iterator, instead of after
    // the whole page has landed.
    //
    // A password channel used to pay for the page crossing the bridge THREE
    // times: the ciphertext out to Kotlin, the same ciphertext back in for
    // pwDecryptBatch, then the plaintext out again — and no PBKDF2 could start
    // until the last row of the resend had arrived. Here each row's derivation
    // begins the moment it is drained, so 310k iterations per message overlap
    // the network wait for the rows still coming.
    //
    // _drainResend's push must stay synchronous (crypto.subtle is async), so
    // each promise is parked and awaited once at the end.
    //
    // A decrypted row carries a PARSED object in `content`. That is what lets
    // the Kotlin side pass it straight through: its predecrypt only re-decrypts
    // rows whose content is still a string. Rows that fail lose `content`
    // altogether and are dropped downstream, exactly as a null batch entry was.
    _sealedOpener(pwKey) {
        const jobs = [];
        return {
            take: function (rec) {
                if (!pwKey || typeof rec.content !== 'string') return;
                jobs.push(api._pwOpen(pwKey, rec.content).then(function (txt) {
                    if (txt == null) { delete rec.content; return; }
                    try { rec.content = JSON.parse(txt); } catch (e) { delete rec.content; }
                }));
            },
            done: function () { return jobs.length ? Promise.all(jobs) : Promise.resolve(); }
        };
    },

    // History via storage-node resend (last N) — returns everything in an array.
    // With `password`, sealed rows are opened during the drain (see
    // _sealedOpener) and come back as parsed objects.
    // With `raw`, the SDK skips its validation pipeline: stored envelopes are
    // NOT re-checked against the present gate state (which would erase
    // ex-members' history) — the Kotlin side establishes authorship from
    // meta.signer instead, so `raw` must always travel with `recoverSigner`.
    async resend(a) {
        if (!client) throw new Error('client not connected');
        const pwKey = a.password ? await api._pwKey(a.password) : null;
        const stream = await client.resend(
            { streamId: a.streamId, partition: a.partition },
            a.raw ? { last: a.last || 50, raw: true } : { last: a.last || 50 }
        );
        const out = [];
        const opener = api._sealedOpener(pwKey);
        const t0 = Date.now();
        const partial = await api._drainResend(stream, function (msg) {
            const rec = {
                content: msg.content,
                meta: {
                    publisherId: msg.publisherId != null ? String(msg.publisherId) : null,
                    timestamp: msg.timestamp
                }
            };
            if (a.recoverSigner) rec.meta.signer = api._recoverEnvelopeSigner(msg);
            out.push(rec);
            opener.take(rec);
        }, Date.now() + (a.budgetMs || 40000), { streamId: a.streamId, partition: a.partition });
        const tDrain = Date.now();
        await opener.done();
        // drainMs = network. decryptMs = the crypto TAIL only, i.e. the part
        // that found no network wait left to hide behind. A large tail means
        // PBKDF2 is the wall, not the storage node.
        return {
            messages: out, partial: partial,
            drainMs: tDrain - t0, decryptMs: Date.now() - tDrain
        };
    },

    // Older history for scroll-up pagination — mirror of streamr.js
    // `fetchOlderHistory`: range resend from epoch to `before` (INCLUSIVE upper
    // bound; the caller dedups the boundary message by id, so messages sharing
    // the boundary millisecond are never skipped), then keep only the newest
    // `last` entries. hasMore is true when the range held more than that.
    async resendRange(a) {
        if (!client) throw new Error('client not connected');
        const pwKey = a.password ? await api._pwKey(a.password) : null;
        const stream = await client.resend(
            { streamId: a.streamId, partition: a.partition },
            a.raw
                ? { from: { timestamp: 0 }, to: { timestamp: a.before }, raw: true }
                : { from: { timestamp: 0 }, to: { timestamp: a.before } }
        );
        const all = [];
        const opener = api._sealedOpener(pwKey);
        const partial = await api._drainResend(stream, function (msg) {
            const rec = {
                content: msg.content,
                meta: {
                    publisherId: msg.publisherId != null ? String(msg.publisherId) : null,
                    timestamp: msg.timestamp
                }
            };
            if (a.recoverSigner) rec.meta.signer = api._recoverEnvelopeSigner(msg);
            all.push(rec);
            opener.take(rec);
        }, Date.now() + (a.budgetMs || 40000), { streamId: a.streamId, partition: a.partition });
        await opener.done();
        // The resend iterator order is not guaranteed; sort ASC before slicing.
        all.sort((x, y) => (x.meta.timestamp || 0) - (y.meta.timestamp || 0));
        const count = a.last || 50;
        const start = Math.max(0, all.length - count);
        // A cut-short drain cannot prove exhaustion — keep pagination alive.
        return { messages: all.slice(start), hasMore: all.length > count || partial, partial: partial };
    },

    // Bounded time-window resend, for DM pagination (streamr.js
    // fetchOlderHistoryWindowed). A DM inbox holds every peer's messages, so a
    // count-based `last: N` would be swallowed by busier conversations; a time
    // window returns whatever this peer actually sent in that range, even if
    // that is nothing.
    async resendWindow(a) {
        if (!client) throw new Error('client not connected');
        const windowStart = Math.max(0, a.before - a.windowMs);
        const windowEnd = a.before - 1;
        const stream = await client.resend(
            { streamId: a.streamId, partition: a.partition },
            { from: { timestamp: windowStart }, to: { timestamp: windowEnd } }
        );
        const out = [];
        const partial = await api._drainResend(stream, function (msg) {
            const rec = {
                content: msg.content,
                meta: {
                    publisherId: msg.publisherId != null ? String(msg.publisherId) : null,
                    timestamp: msg.timestamp
                }
            };
            if (a.recoverSigner) rec.meta.signer = api._recoverEnvelopeSigner(msg);
            out.push(rec);
        }, Date.now() + (a.budgetMs || 40000), { streamId: a.streamId, partition: a.partition });
        // Reaching epoch means there is nothing older left to scan.
        return { messages: out, hasMore: windowStart > 0 || partial, windowStart: windowStart, partial: partial };
    },

    // Owner-only channel edit — one on-chain tx that rewrites the Pombo JSON
    // held in the stream description (streamr.js updateStreamMetadata).
    async updateStreamMetadata(a) {
        if (!client) throw new Error('client not connected');
        const stream = await client.getStream(a.streamId);
        if (!stream) throw new Error('Stream not found');
        let meta = {};
        try {
            const desc = await stream.getDescription();
            meta = desc ? JSON.parse(desc) : {};
        } catch (e) { meta = {}; }
        if (typeof a.name === 'string') meta.n = a.name;
        if (typeof a.description === 'string') meta.d = a.description;
        await stream.setDescription(JSON.stringify(meta));
        return { ok: true };
    },

    // Storage assignment for a stream (nodes + retention).
    async getStreamStorageInfo(a) {
        if (!client) throw new Error('client not connected');
        try {
            const stream = await client.getStream(a.streamId);
            const res = stream.getStorageNodes();
            let nodes = [];
            if (Array.isArray(res)) nodes = res;
            else if (res && typeof res.then === 'function') nodes = await res;
            else if (res && typeof res[Symbol.asyncIterator] === 'function') {
                for await (const n of res) nodes.push(n);
            } else if (res && typeof res[Symbol.iterator] === 'function') nodes = [...res];
            // Retention only exists once a node is assigned, and the call fails
            // outright when the node never had a TTL set — hence best-effort.
            let storageDays = null;
            if (nodes.length > 0) {
                try {
                    const d = await stream.getStorageDayCount();
                    if (d !== null && d !== undefined) {
                        storageDays = typeof d === 'bigint' ? Number(d) : Number(d);
                    }
                } catch (e) { /* TTL not set on this node */ }
            }
            return {
                enabled: nodes.length > 0,
                nodes: nodes.map(function (n) { return String(n); }),
                storageDays: storageDays
            };
        } catch (e) {
            return { enabled: false, nodes: [], storageDays: null };
        }
    },

    async removeFromStorageNode(a) {
        if (!client) throw new Error('client not connected');
        const stream = await client.getStream(a.streamId);
        await stream.removeFromStorageNode(a.nodeAddress);
        return { ok: true };
    },

    // Delete one stream on-chain. Mirrors streamr.js deleteStream's per-stream
    // half: "stream does not exist" counts as success, because the caller may
    // be retrying after a partial delete or the channel may predate -3.
    // The caller deletes -1/-2/-3 separately so a failure on one is visible
    // rather than silently aborting the rest.
    async deleteStream(a) {
        if (!client) throw new Error('client not connected');
        try {
            await client.deleteStream(a.streamId);
            return { ok: true, deleted: true };
        } catch (e) {
            const msg = String(e?.reason || e?.message || e || '');
            if (/streamDoesNotExist|stream.*does.*not.*exist|stream.*not.*found/i.test(msg)) {
                return { ok: true, deleted: false, alreadyGone: true };
            }
            throw e;
        }
    },

    // ===== ENS (mainnet reverse lookup, like identity.js resolveENS) =====

    // Reverse-lookup buried among throwaway addresses (identity.js
    // _lookupWithDecoys): the RPC operator sees N+1 addresses and cannot tell
    // which one we care about. All N+1 go out CONCURRENTLY and in shuffled
    // order — issuing the real one first and the decoys after leaves the
    // ordering as a giveaway. Decoys are inert: results discarded, failures
    // swallowed; only the real lookup's outcome propagates.
    async _lookupWithDecoys(provider, address, withCover) {
        var count = withCover ? ENS_DECOY_COUNT : 0;
        if (count <= 0) return provider.lookupAddress(address);

        var slots = [{ real: true, addr: address }];
        try {
            for (var i = 0; i < count; i++) {
                slots.push({ real: false, addr: window.ethers.hexlify(window.ethers.randomBytes(20)) });
            }
        } catch (e) {
            // No RNG available — resolve without cover rather than not at all.
            return provider.lookupAddress(address);
        }

        // Fisher-Yates with crypto randomness, so the real address's position
        // is not derivable from a predictable PRNG sequence.
        var rand = crypto.getRandomValues(new Uint32Array(slots.length));
        for (var i = slots.length - 1; i > 0; i--) {
            var j = rand[i] % (i + 1);
            var tmp = slots[i]; slots[i] = slots[j]; slots[j] = tmp;
        }

        var realResult = null;
        var realError = null;
        await Promise.all(slots.map(async function (slot) {
            try {
                var result = await provider.lookupAddress(slot.addr);
                if (slot.real) realResult = result;
            } catch (error) {
                if (slot.real) realError = error;
            }
        }));

        if (realError) throw realError;
        return realResult;
    },

    async resolveEns(a) {
        var addr = String(a.address || '');
        if (!ensProviders) {
            ensProviders = ENS_RPCS.map(function (u) {
                try { return new window.ethers.JsonRpcProvider(u, 1, { staticNetwork: true }); }
                catch (e) { return null; }
            }).filter(Boolean);
        }
        // Cover traffic goes out ONCE per resolution, not once per provider:
        // a null result still walks every provider, so decoying each attempt
        // multiplies the request count until the free tiers answer HTTP 429
        // (identity.js _doResolveENS learned this the hard way).
        var coverUsed = false;
        for (var i = 0; i < ensProviders.length; i++) {
            try {
                var name = await api._lookupWithDecoys(ensProviders[i], addr, !coverUsed);
                coverUsed = true;
                if (name) return { name: name };
            } catch (e) { /* try the next provider */ }
        }
        return { name: null };
    },

    // ENS avatar text record (identity.js _doResolveENSAvatar). ipfs:// is
    // rewritten to the gateway; anything not https:/data: is rejected.
    async resolveEnsAvatar(a) {
        var name = String(a.name || '');
        if (!name) return { url: null };
        // Initialize the provider list like resolveEns does. This function
        // used to bail out when it was null — and when every NAME was already
        // cached on the Kotlin side (disk cache or the ensCache sync slice),
        // the avatar lookup was the FIRST ENS call of the session, so every
        // avatar resolved to null without ever touching the network.
        if (!ensProviders) {
            ensProviders = ENS_RPCS.map(function (u) {
                try { return new window.ethers.JsonRpcProvider(u, 1, { staticNetwork: true }); }
                catch (e) { return null; }
            }).filter(Boolean);
        }
        for (var i = 0; i < ensProviders.length; i++) {
            try {
                var resolver = await ensProviders[i].getResolver(name);
                if (!resolver) continue;
                var rec = await resolver.getText('avatar');
                if (!rec) continue;
                var url = rec;
                if (url.indexOf('ipfs://') === 0) {
                    // cloudflare-ipfs.com is DEAD (gateway shut down) — it was
                    // why fresh installs never loaded ipfs:// avatars.
                    url = 'https://ipfs.io/ipfs/' + url.slice(7);
                }
                if (url.indexOf('https://') !== 0 && url.indexOf('data:') !== 0) continue;
                return { url: url };
            } catch (e) { /* try the next provider */ }
        }
        return { url: null };
    },

    // Forward ENS resolution (name -> address), for adding a member by name.
    async resolveEnsName(a) {
        var name = String(a.name || '').trim();
        if (!name) return { address: null };
        if (!ensProviders) {
            ensProviders = ENS_RPCS.map(function (u) {
                try { return new window.ethers.JsonRpcProvider(u, 1, { staticNetwork: true }); }
                catch (e) { return null; }
            }).filter(Boolean);
        }
        for (var i = 0; i < ensProviders.length; i++) {
            try {
                var addr = await ensProviders[i].resolveName(name);
                if (addr) return { address: addr };
            } catch (e) { /* try the next provider */ }
        }
        return { address: null };
    },

    // ===== push notifications (wake signals) =====
    //
    // Mirror of pushProtocol.js. The proof-of-work loop runs here rather than
    // in Kotlin so it uses the very same ethers keccak256 the relay validates
    // against — reimplementing the hash natively would risk a silent mismatch,
    // and round-tripping each iteration over the bridge would be far too slow.
    // Tag only, no proof of work — registration does not need one, and the
    // relay only validates PoW on wake signals.
    async pushTag(a) {
        var eth = window.ethers;
        if (!eth) throw new Error('ethers not available');
        var streamId = String(a.streamId || '').toLowerCase();
        if (!streamId) throw new Error('Invalid streamId');
        var prefix = a.native ? 'native:' : 'channel:';
        var tagHexChars = 2 + (PUSH_TAG_BYTES * 2);
        return { tag: eth.keccak256(eth.toUtf8Bytes(prefix + streamId)).slice(0, tagHexChars) };
    },

    async pushWakePayload(a) {
        var eth = window.ethers;
        if (!eth) throw new Error('ethers not available');
        var streamId = String(a.streamId || '').toLowerCase();
        if (!streamId) throw new Error('Invalid streamId');

        // 'native:' ONLY for native channels; public, password AND DMs use
        // 'channel:' (a DM wakes the peer's inbox under its channel tag —
        // web dm.js → sendChannelWakeSignal).
        var prefix = a.native ? 'native:' : 'channel:';
        var tagHexChars = 2 + (PUSH_TAG_BYTES * 2);
        var tag = eth.keccak256(eth.toUtf8Bytes(prefix + streamId)).slice(0, tagHexChars);

        var target = '0'.repeat(PUSH_POW_DIFFICULTY);
        // 10-second epoch is entropy against replay; the relay recomputes it.
        var epoch = Math.floor(Date.now() / 10000);
        var startTime = Date.now();
        var nonce = 0;
        while (Date.now() - startTime < PUSH_POW_MAX_MS) {
            var pow = eth.keccak256(eth.toUtf8Bytes(tag + ':' + epoch + ':' + nonce));
            if (pow.slice(2).indexOf(target) === 0) {
                return {
                    payload: {
                        type: 'notification',
                        tag: tag,
                        pow: pow,
                        nonce: nonce,
                        epoch: epoch,
                        // `kind` overrides for non-message wakes (e.g. 'keys',
                        // a key-request wake): the relay forwards channelType
                        // verbatim and receivers branch on it.
                        channelType: a.kind ? String(a.kind) : (a.native ? 'private' : 'public'),
                        timestamp: Date.now()
                    }
                };
            }
            nonce++;
        }
        throw new Error('PoW timeout - could not find valid nonce');
    },

    // Reads the peer's compressed pubkey from the `pk` field of their inbox metadata.
    async getPeerPublicKey(a) {
        if (!client) throw new Error('client not connected');
        const streamId = String(a.address).toLowerCase() + '/Pombo-DM-1';
        try {
            const stream = await client.getStream(streamId);
            const desc = (typeof stream.getDescription === 'function')
                ? await stream.getDescription()
                : (stream.metadata && JSON.parse(stream.metadata || '{}').description);
            const meta = JSON.parse(desc || '{}');
            const pk = meta.pk || null;
            if (!pk) return { publicKey: null };
            // The stream namespace proves ownership on-chain, but this read
            // travels through user-chosen RPCs with public failover — a
            // hostile RPC forging `pk` here would be a full DM MITM. The key
            // must BE the address.
            if (window.ethers.computeAddress(pk).toLowerCase() !== String(a.address).toLowerCase()) {
                console.warn('DM: inbox metadata public key does not match its owner — rejecting ' + streamId);
                return { publicKey: null };
            }
            return { publicKey: pk };
        } catch (e) { return { publicKey: null }; }
    },


    // Publisher-proof recovery (web publisherProof.js recoverPublisherAccount):
    //
    //   digest = keccak256(utf8('POMBO_PUB_V1|' + lowercase(publisherId)))
    //   proof  = raw 65-byte ECDSA over that digest (SigningKey.sign — NOT
    //            personal_sign, so ethers.recoverAddress, not verifyMessage)
    //
    // The digest is rebuilt from the publisherId that arrived ON THE WIRE —
    // that binding is the whole security argument: a proof lifted onto another
    // publisher recovers a different, meaningless address. Failures come back
    // as null, not errors: a malformed proof is untrusted input on a public
    // stream, not an exceptional condition. Kotlin caches by (publisherId,
    // proof), so this runs once per ephemeral key, not once per message.
    //   { items: [{ publisherId, proof }] } -> { accounts: [address|null] }
    async recoverPublisherProofBatch(a) {
        var out = [];
        var items = a.items || [];
        for (var i = 0; i < items.length; i++) {
            try {
                var digest = window.ethers.keccak256(window.ethers.toUtf8Bytes(
                    'POMBO_PUB_V1|' + String(items[i].publisherId).toLowerCase()));
                out.push(window.ethers.recoverAddress(digest, String(items[i].proof)).toLowerCase());
            } catch (e) { out.push(null); }
        }
        return { accounts: out };
    },

    // One evaluateJavascript round-trip for a page of signature checks (web
    // verifies in a worker pool; the WebView is single-threaded, so the win
    // here is the per-call bridge overhead on large resends).
    async verifyCanonicalBatch(a) {
        var out = [];
        for (var i = 0; i < a.items.length; i++) {
            try {
                var it = a.items[i];
                var hash = window.ethers.keccak256(window.ethers.toUtf8Bytes(it.data));
                out.push(window.ethers.verifyMessage(hash, it.signature));
            } catch (e) { out.push(''); }
        }
        return { addresses: out };
    },

    // DM storage-chunk download: resend a time window from the RECEIVER's OWN
    // inbox (a DM inbox is private at the Streamr layer, so direct HTTP would
    // return SDK ciphertext — the download reads via SDK resend only). Rows
    // cross back SEALED — Kotlin opens them with the pair's ECDH key
    // (SealedSenderCrypto.pairOpen), so the static key never enters this page
    // and the failed-open skip lives with the key.
    //
    // Cost note: a window can carry many 240KB chunks, so the base64 payload
    // that crosses back can be large. This is the only correct DM path (the
    // SDK resend lives here); password/public downloads stay native HTTP.
    //   { streamId, partition, fromTs, toTs, budgetMs? }
    //   -> { rows: [{ timestamp, publisherId, data: b64(sealed [iv][ct]) }] }
    async resendStorageChunksDm(a) {
        if (!client) throw new Error('client not connected');
        const stream = await client.resend(
            { streamId: a.streamId, partition: a.partition },
            { from: { timestamp: a.fromTs }, to: { timestamp: a.toTs } }
        );
        const rows = [];
        await api._drainResend(stream, function (msg) {
            const u8 = asU8(msg.content);
            if (!u8 || u8.length < 28) return; // warm-up ping / non-chunk
            rows.push({
                timestamp: msg.timestamp,
                publisherId: msg.publisherId != null ? String(msg.publisherId) : null,
                data: u8ToB64(u8)
            });
        }, Date.now() + (a.budgetMs || 60000), { streamId: a.streamId, partition: a.partition });
        return { rows: rows };
    },

    // Creates the caller's own DM inbox (message + ephemeral streams) on-chain.
    async createDMInbox(a) {
        if (!client) throw new Error('client not connected');
        const me = (await client.getAddress()).toLowerCase();
        const messageStreamId = me + '/Pombo-DM-1';
        const ephemeralStreamId = me + '/Pombo-DM-2';
        const meta = JSON.stringify({ a: 'pombo', v: '1', t: 'dm-inbox', pk: a.publicKey });
        const ephMeta = JSON.stringify({ a: 'pombo', v: '1', ln: messageStreamId });
        async function getOrCreate(id, description, partitions) {
            try { return await client.getStream(id); }
            catch (e) { return await client.createStream({ id: id, description: description, partitions: partitions }); }
        }
        // 13 partitions: P0-P3 classic + P4-P12 storage-file chunks (mirror of
        // MESSAGE_STREAM.DM_PARTITIONS / StreamConstants.MSG_DM_PARTITIONS).
        await getOrCreate(messageStreamId, meta, 13);
        await getOrCreate(ephemeralStreamId, ephMeta, 3);
        // Public PUBLISH only (owner reads by ownership) — hides the social graph.
        const pubOnly = [{ public: true, permissions: ['publish'] }];
        await client.setPermissions({ streamId: messageStreamId, assignments: pubOnly });
        await client.setPermissions({ streamId: ephemeralStreamId, assignments: pubOnly });
        try {
            const s = await client.getStream(messageStreamId);
            await s.addToStorageNode('0xae340e799e8151f6a4999d245e466197aa217667');
        } catch (e) { /* storage best-effort */ }
        return { messageStreamId: messageStreamId, ephemeralStreamId: ephemeralStreamId };
    },

    // ===== DM inbox diagnosis & repair (web streamr.diagnoseInbox/repairInbox) =====

    async diagnoseDmInbox(a) {
        if (!client) throw new Error('client not connected');
        const me = (await client.getAddress()).toLowerCase();
        const messageStreamId = me + '/Pombo-DM-1';
        const ephemeralStreamId = me + '/Pombo-DM-2';
        const report = {
            messageStream: { id: messageStreamId, exists: false, partitions: null, partitionsCorrect: false, metadataOk: false, publicKeyPresent: false },
            ephemeralStream: { id: ephemeralStreamId, exists: false, partitions: null },
            permissions: { messagePublicPublish: false, ephemeralPublicPublish: false },
            storage: { enabled: false, provider: null, storageDays: null, nodeAddress: null, nodes: [] }
        };
        let messageStream = null, ephemeralStream = null;
        try {
            messageStream = await client.getStream(messageStreamId);
            report.messageStream.exists = true;
            const p = await messageStream.getPartitionCount();
            report.messageStream.partitions = typeof p === 'bigint' ? Number(p) : p;
            // 13 = P0-P3 classic + P4-P12 storage-file chunks (no backward compat
            // with the old 4-partition inboxes — they are recreated).
            report.messageStream.partitionsCorrect = report.messageStream.partitions >= 13;
            try {
                const desc = await messageStream.getDescription();
                if (desc) {
                    const meta = JSON.parse(desc);
                    report.messageStream.metadataOk = !!(meta.a && meta.t === 'dm-inbox');
                    report.messageStream.publicKeyPresent = !!meta.pk;
                }
            } catch (e) { /* metadata unreadable */ }
        } catch (e) { /* stream missing */ }
        try {
            ephemeralStream = await client.getStream(ephemeralStreamId);
            report.ephemeralStream.exists = true;
            const p = await ephemeralStream.getPartitionCount();
            report.ephemeralStream.partitions = typeof p === 'bigint' ? Number(p) : p;
        } catch (e) { /* stream missing */ }
        const SP = window.StreamPermission;
        if (SP && messageStream) {
            try { report.permissions.messagePublicPublish = await messageStream.hasPermission({ permission: SP.PUBLISH, public: true }); } catch (e) {}
        }
        if (SP && ephemeralStream) {
            try { report.permissions.ephemeralPublicPublish = await ephemeralStream.hasPermission({ permission: SP.PUBLISH, public: true }); } catch (e) {}
        }
        if (messageStream) {
            try {
                const info = await api.getStorageInfo({ streamId: messageStreamId });
                report.storage.enabled = info.enabled;
                report.storage.storageDays = info.storageDays;
                report.storage.nodes = info.nodes;
                if (info.enabled && info.nodes.length) {
                    const nodeAddr = String(info.nodes[0]).toLowerCase();
                    report.storage.nodeAddress = nodeAddr;
                    report.storage.provider = nodeAddr === '0xae340e799e8151f6a4999d245e466197aa217667' ? 'streamr' : 'custom';
                }
            } catch (e) { /* storage check best-effort */ }
        }
        return report;
    },

    // Repairs only what the diagnosis flagged, same steps as the web.
    // { diagnosis, publicKey } -> { steps: { name: 'ok'|'skip'|'fail' } }
    async repairDmInbox(a) {
        if (!client) throw new Error('client not connected');
        const d = a.diagnosis;
        const messageStreamId = d.messageStream.id;
        const ephemeralStreamId = d.ephemeralStream.id;
        const steps = {
            messageStream: 'skip', ephemeralStream: 'skip', partitions: 'skip',
            metadata: 'skip', messagePermissions: 'skip', ephemeralPermissions: 'skip', storage: 'skip'
        };
        const metadata = JSON.stringify({ a: 'pombo', v: '1', t: 'dm-inbox', pk: a.publicKey });
        const ephMeta = JSON.stringify({ a: 'pombo', v: '1', ln: messageStreamId });
        const pubOnly = [{ public: true, permissions: ['publish'] }];
        let messageStream = null, ephemeralStream = null;

        if (!d.messageStream.exists) {
            try {
                messageStream = await client.createStream({ id: messageStreamId, description: metadata, partitions: 13 });
                steps.messageStream = 'ok';
            } catch (e) { steps.messageStream = 'fail'; }
        } else {
            try { messageStream = await client.getStream(messageStreamId); } catch (e) {}
        }
        if (messageStream && d.messageStream.exists && !d.messageStream.partitionsCorrect) {
            try {
                const m = await messageStream.getMetadata();
                await messageStream.setMetadata(Object.assign({}, m, { partitions: 13 }));
                steps.partitions = 'ok';
            } catch (e) { steps.partitions = 'fail'; }
        }
        if (!d.ephemeralStream.exists) {
            try {
                ephemeralStream = await client.createStream({ id: ephemeralStreamId, description: ephMeta, partitions: 3 });
                steps.ephemeralStream = 'ok';
            } catch (e) { steps.ephemeralStream = 'fail'; }
        } else {
            try { ephemeralStream = await client.getStream(ephemeralStreamId); } catch (e) {}
        }
        if (messageStream && a.publicKey && !d.messageStream.publicKeyPresent) {
            try {
                const desc = await messageStream.getDescription();
                const meta = desc ? JSON.parse(desc) : { a: 'pombo', v: '1', t: 'dm-inbox' };
                meta.pk = a.publicKey;
                await messageStream.setDescription(JSON.stringify(meta));
                steps.metadata = 'ok';
            } catch (e) { steps.metadata = 'fail'; }
        }
        if (messageStream && !d.permissions.messagePublicPublish) {
            try {
                await client.setPermissions({ streamId: messageStreamId, assignments: pubOnly });
                steps.messagePermissions = 'ok';
            } catch (e) { steps.messagePermissions = 'fail'; }
        }
        if (ephemeralStream && !d.permissions.ephemeralPublicPublish) {
            try {
                await client.setPermissions({ streamId: ephemeralStreamId, assignments: pubOnly });
                steps.ephemeralPermissions = 'ok';
            } catch (e) { steps.ephemeralPermissions = 'fail'; }
        }
        if (messageStream && !d.storage.enabled) {
            try {
                const s = await client.getStream(messageStreamId);
                await s.addToStorageNode('0xae340e799e8151f6a4999d245e466197aa217667');
                try { await s.setStorageDayCount(180); } catch (e) { /* TTL best-effort */ }
                steps.storage = 'ok';
            } catch (e) { steps.storage = 'fail'; }
        }
        return { steps: steps };
    },

    // ===== storage node management (web getStreamStorageInfo & friends) =====

    async getStorageInfo(a) {
        if (!client) throw new Error('client not connected');
        const stream = await client.getStream(a.streamId);
        const res = stream.getStorageNodes();
        let nodes = [];
        if (Array.isArray(res)) nodes = res;
        else if (res && typeof res.then === 'function') nodes = await res;
        else if (res && typeof res[Symbol.asyncIterator] === 'function') { for await (const n of res) nodes.push(n); }
        else if (res && typeof res[Symbol.iterator] === 'function') nodes = [...res];
        nodes = nodes.map(function (n) { return String(n); });
        let storageDays = null;
        if (nodes.length) {
            try {
                const dcount = await stream.getStorageDayCount();
                if (dcount != null) storageDays = typeof dcount === 'bigint' ? Number(dcount) : dcount;
            } catch (e) { /* TTL not set on this node */ }
        }
        return { enabled: nodes.length > 0, nodes: nodes, storageDays: storageDays };
    },

    async removeStorageNode(a) {
        if (!client) throw new Error('client not connected');
        const stream = await client.getStream(a.streamId);
        await stream.removeFromStorageNode(a.nodeAddress);
        return { ok: true };
    },

    // On-chain resolution of a stream's storage-node HTTP endpoints, for the
    // Persistent File Sharing transport. Mirror of web storageEndpoints.js
    // resolveUncached (two SDK calls: getStorageNodes -> node addresses,
    // getStorageNodeMetadata -> {urls}), EXCEPT the web-safe URL filtering is
    // left to the native StorageEndpoints so the filter is unit-testable in
    // Kotlin — here every raw URL is returned. The direct HTTP reads themselves
    // run natively (OkHttp), not through this WebView.
    //   -> { nodes: [{ nodeAddress, urls: [...] }] }   (may be empty)
    async resolveStorageEndpoints(a) {
        if (!client) throw new Error('client not connected');
        const stream = await client.getStream(a.streamId);
        const res = stream.getStorageNodes();
        let addresses = [];
        if (Array.isArray(res)) addresses = res;
        else if (res && typeof res.then === 'function') addresses = await res;
        else if (res && typeof res[Symbol.asyncIterator] === 'function') { for await (const n of res) addresses.push(n); }
        else if (res && typeof res[Symbol.iterator] === 'function') addresses = [...res];
        const nodes = [];
        for (const address of addresses) {
            try {
                const md = await client.getStorageNodeMetadata(address);
                const urls = (Array.isArray(md && md.urls) ? md.urls : [])
                    .filter(function (u) { return typeof u === 'string'; });
                nodes.push({ nodeAddress: String(address).toLowerCase(), urls: urls });
            } catch (e) {
                console.warn('storage node metadata read failed: ' + address + ' — ' + (e && e.message || e));
            }
        }
        return { nodes: nodes };
    },

    async setStorageDays(a) {
        if (!client) throw new Error('client not connected');
        const stream = await client.getStream(a.streamId);
        await stream.setStorageDayCount(a.storageDays);
        return { ok: true };
    },

    // ===== stream management (channel creation) =====

    // Get-or-create for FIXED stream ids (DM inbox): a re-run after a partial
    // failure must not die on "stream already exists".
    async getOrCreateStream(a) {
        if (!client) throw new Error('client not connected');
        try {
            await client.getStream(a.id);
            return { id: a.id, existed: true };
        } catch (e) {
            const s = await client.createStream({ id: a.id, description: a.description, partitions: a.partitions });
            return { id: s.id, existed: false };
        }
    },

    // Creates a stream on-chain: {id, description, partitions}
    async createStream(a) {
        if (!client) throw new Error('client not connected');
        const stream = await client.createStream({
            id: a.id,
            description: a.description,
            partitions: a.partitions
        });
        return { id: stream.id };
    },

    // assignments: [{public:true, permissions:[...]}] or [{userId, permissions:[...]}]
    async setPermissions(a) {
        if (!client) throw new Error('client not connected');
        await client.setPermissions({ streamId: a.streamId, assignments: a.assignments });
        return { ok: true };
    },

    async addToStorageNode(a) {
