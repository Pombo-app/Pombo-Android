        if (!client) throw new Error('client not connected');
        const stream = await client.getStream(a.streamId);
        await stream.addToStorageNode(a.nodeAddress);
        if (a.storageDays && typeof stream.setStorageDayCount === 'function') {
            try { await stream.setStorageDayCount(a.storageDays); } catch (e) { /* TTL is best-effort */ }
        }
        return { ok: true };
    },

    // Mirror of streamr.js checkPermissions (same hasPermission calls)
    async checkPermissions(a) {
        if (!client) throw new Error('client not connected');
        const stream = await client.getStream(a.streamId);
        const SP = window.StreamPermission;
        const me = await client.getAddress();
        const r = await Promise.all([
            stream.hasPermission({ permission: SP.PUBLISH, userId: me, allowPublic: true }),
            stream.hasPermission({ permission: SP.SUBSCRIBE, userId: me, allowPublic: true }),
            stream.hasPermission({ permission: SP.GRANT, userId: me, allowPublic: false }),
            stream.hasPermission({ permission: SP.EDIT, userId: me, allowPublic: false }),
            stream.hasPermission({ permission: SP.DELETE, userId: me, allowPublic: false })
        ]);
        return {
            canPublish: r[0], canSubscribe: r[1], canGrant: r[2], canEdit: r[3], canDelete: r[4],
            isOwner: r[2] && r[3] && r[4]
        };
    },

    // Stream metadata (the description holds the pombo JSON {a,v,n,t,e,...})
    async getStreamInfo(a) {
        if (!client) throw new Error('client not connected');
        const stream = await client.getStream(a.streamId);
        let md = null;
        try {
            md = (typeof stream.getMetadata === 'function') ? await stream.getMetadata() : stream.metadata;
        } catch (e) { md = null; }
        return { metadata: md || {} };
    },

        'function allowance(address owner, address spender) view returns (uint256)',
        'function approve(address spender, uint256 value) returns (bool)',
        'function decimals() view returns (uint8)',
        'function symbol() view returns (string)'
    ],
    // Canonical wrapped-native on Polygon (WPOL, WETH9 code). gatePay auto-
    // wraps native POL into it when the WPOL balance is short — deposit() is
    // only assumed safe for THIS address, never for arbitrary payment tokens.
    _WRAPPED_NATIVE: '0x0d500b1d8e8ef31e21c99d1db9a6444d3adf1270',
    _WRAPPED_NATIVE_ABI: ['function deposit() payable'],
    _gateTokenMetaCache: new Map(), // token -> { symbol, decimals|null }
    _gateRpcIndex: 0,
    _gateProviderUrl: null,
    _gateProviderInst: null,
    _gateAccessCache: new Map(), // "gate|user" -> { value, at }; TTL 10 min

    _gateRpcUrl() {
        // RPCS is the settings-derived list injected at page build — entries
        // are Streamr-shaped ({url}); JsonRpcProvider needs the string or it
        // treats the object as a FetchRequest.
        const list = (typeof RPCS !== 'undefined' && RPCS && RPCS.length) ? RPCS : [{ url: 'https://polygon-bor-rpc.publicnode.com' }];
        const entry = list[api._gateRpcIndex % list.length];
        return typeof entry === 'string' ? entry : entry.url;
    },

    _gateProvider() {
        const url = api._gateRpcUrl();
        if (!api._gateProviderInst || api._gateProviderUrl !== url) {
            api._gateProviderInst = new window.ethers.JsonRpcProvider(url, 137, {
                staticNetwork: true, batchMaxCount: 1
            });
            api._gateProviderUrl = url;
        }
        return api._gateProviderInst;
    },

    async _gateWithProvider(op) {
        try {
            return await op(api._gateProvider());
        } catch (firstError) {
            api._gateRpcIndex++;
            api._gateProviderInst = null;
            console.warn('gate: RPC failed, rotating endpoint: ' + (firstError && firstError.message || firstError));
            return op(api._gateProvider());
        }
    },

    _gateRead(gateAddress) {
        return new window.ethers.Contract(gateAddress, api._GATE_ABI, api._gateProvider());
    },

    _gateSigner() {
        if (!wallet) throw new Error('no identity');
        return new NativeSigner(api._gateProvider());
    },

    async _gateTx(gateAddress, method, args) {
        const gate = new window.ethers.Contract(gateAddress, api._GATE_ABI, api._gateSigner());
        const tx = await gate[method].apply(gate, args);
        await tx.wait();
        // Drop cached access for this gate — membership just changed.
        const prefix = String(gateAddress).toLowerCase();
        Array.from(api._gateAccessCache.keys()).forEach(function (k) {
            if (k.indexOf(prefix) === 0) api._gateAccessCache.delete(k);
        });
        return { ok: true, txHash: tx.hash };
    },

    // { mode, token?, minBalance?, price?, duration? } -> { gate }
    async gateCreate(a) {
        const factory = new window.ethers.Contract(api._GATE_FACTORY, api._GATE_FACTORY_ABI, api._gateSigner());
        const tx = await factory.createGate(
            a.mode || 0,
            a.token || '0x0000000000000000000000000000000000000000',
            a.minBalance != null ? BigInt(a.minBalance) : 0n,
            a.price != null ? BigInt(a.price) : 0n,
            a.duration != null ? BigInt(a.duration) : 0n
        );
        const receipt = await tx.wait();
        var gateAddress = null;
        for (var i = 0; i < receipt.logs.length; i++) {
            try {
                const parsed = factory.interface.parseLog(receipt.logs[i]);
                if (parsed && parsed.name === 'GateCreated') { gateAddress = parsed.args.gate; break; }
            } catch (e) { /* foreign log */ }
        }
        if (!gateAddress) throw new Error('gateCreate: no GateCreated event in receipt');
        return { gate: String(gateAddress).toLowerCase(), txHash: tx.hash };
    },

    // { gate, user } -> { access, failed? } — cached 10 min. An RPC outage
    // returns { access: false, failed: true }, never cached: key-layer
    // callers read `access` alone (fail-closed), content filtering reads
    // `failed` to fail OPEN instead of hiding legitimate traffic.
    async gateCheckAccess(a) {
        const cacheKey = String(a.gate).toLowerCase() + '|' + String(a.user).toLowerCase();
        const cached = api._gateAccessCache.get(cacheKey);
        if (cached && Date.now() - cached.at < 10 * 60 * 1000) return { access: cached.value };
        var value;
        try {
            value = await api._gateWithProvider(function () {
                return api._gateRead(a.gate).checkAccess(a.user);
            });
        } catch (e) {
            console.warn('gate: checkAccess failed (fail-closed): ' + (e && e.message || e));
            return { access: false, failed: true };
        }
        if (api._gateAccessCache.size > 2000) {
            api._gateAccessCache.delete(api._gateAccessCache.keys().next().value);
        }
        api._gateAccessCache.set(cacheKey, { value: !!value, at: Date.now() });
        return { access: !!value };
    },

    // { gate } -> { owner, mode, token, minBalance, price, duration }
    async gateInfo(a) {
        return api._gateWithProvider(async function () {
            const gate = api._gateRead(a.gate);
            const r = await Promise.all([
                gate.owner(), gate.mode(), gate.token(),
                gate.minBalance(), gate.price(), gate.duration()
            ]);
            return {
                owner: String(r[0]).toLowerCase(), mode: Number(r[1]),
                token: String(r[2]).toLowerCase(), minBalance: String(r[3]),
                price: String(r[4]), duration: String(r[5])
            };
        });
    },

    // { gate, candidates: [addr] } -> { members: [{address, isOwner, allowed,
    // banned, everMember, erased, moderator, paidUntil}] } — candidate flags,
    // NO event scan (free RPCs cap eth_getLogs at 10k blocks; enumeration →
    // indexer, N-D). paidUntil (unix seconds) is only read on PAID gates.
    async gateMembers(a) {
        return api._gateWithProvider(async function () {
            const gate = api._gateRead(a.gate);
            const r = await Promise.all([gate.owner(), gate.mode().catch(function () { return 0; })]);
            const owner = String(r[0]).toLowerCase();
            const isPaid = Number(r[1]) === 3;
            const gateAddr = String(a.gate).toLowerCase();
            const set = {};
            set[owner] = true;
            (a.candidates || []).forEach(function (c) {
                const addr = String(c || '').toLowerCase();
                if (/^0x[0-9a-f]{40}$/.test(addr) && addr !== gateAddr) set[addr] = true;
            });
            const addresses = Object.keys(set);
            const members = await Promise.all(addresses.map(async function (address) {
                const f = await Promise.all([
                    gate.allowlist(address), gate.banned(address),
                    gate.everMember(address), gate.erased(address),
                    gate.moderators(address).catch(function () { return false; }), // v1 gates predate the getter
                    // Mode-aware CURRENT membership — `allowed` only means NONE
                    gate.checkAccess(address).catch(function () { return false; }),
                    isPaid ? gate.paidUntil(address).then(function (v) { return Number(v); }).catch(function () { return 0; }) : 0
                ]);
                return {
                    address: address, allowed: !!f[0], banned: !!f[1],
                    everMember: !!f[2], erased: !!f[3], moderator: !!f[4],
                    access: !!f[5], paidUntil: f[6], isOwner: address === owner
                };
            }));
            members.sort(function (x, y) {
                return (y.isOwner - x.isOwner) || (y.moderator - x.moderator) ||
                    (y.access - x.access) || x.address.localeCompare(y.address);
            });
            return { members: members };
        });
    },

    async gateAllow(a) { return api._gateTx(a.gate, 'allow', [a.user]); },
    async gateRevokeAllow(a) { return api._gateTx(a.gate, 'revokeAllow', [a.user]); },
    async gateAllowBatch(a) { return api._gateTx(a.gate, 'allowBatch', [a.users || []]); },
    async gateBan(a) { return api._gateTx(a.gate, 'ban', [a.user, !!a.erase]); },
    async gateUnban(a) { return api._gateTx(a.gate, 'unban', [a.user]); },
    async gateSetModerator(a) { return api._gateTx(a.gate, 'setModerator', [a.user, !!a.enabled]); },

    _gateReadToken(tokenAddress) {
        return new window.ethers.Contract(tokenAddress, api._GATE_TOKEN_ABI, api._gateProvider());
    },

    // { token } -> { symbol, decimals|null } — null decimals = ERC-721
    // collection (the getter does not exist there), render whole units.
    async gateTokenMeta(a) {
        const key = String(a.token).toLowerCase();
        if (api._gateTokenMetaCache.has(key)) return api._gateTokenMetaCache.get(key);
        const meta = await api._gateWithProvider(async function () {
            const token = api._gateReadToken(a.token);
            const r = await Promise.all([
                token.symbol().catch(function () { return key.slice(0, 6) + '…' + key.slice(-4); }),
                token.decimals().then(function (d) { return Number(d); }).catch(function () { return null; })
            ]);
            return { symbol: r[0], decimals: r[1] };
        });
        api._gateTokenMetaCache.set(key, meta);
        return meta;
    },

    // { token, user } -> { balance } string bigint (ERC-721 = owned count)
    async gateTokenBalance(a) {
        const balance = await api._gateWithProvider(function () {
            return api._gateReadToken(a.token).balanceOf(a.user);
        });
        return { balance: String(balance) };
    },

    // { gate, user } -> { paidUntil } unix seconds string; '0' = never paid
    async gatePaidUntil(a) {
        const until = await api._gateWithProvider(function () {
            return api._gateRead(a.gate).paidUntil(a.user);
        });
        return { paidUntil: String(until) };
    },

    // { gate, user? } — drop cached access. The entry screen's recheck/enter
    // need this: the deny that opened it is cached fail-closed for 10 min,
    // so a user who just paid/bought would still be refused.
    async gateInvalidateAccess(a) {
        const prefix = String(a.gate).toLowerCase();
        const exact = a.user ? prefix + '|' + String(a.user).toLowerCase() : null;
        Array.from(api._gateAccessCache.keys()).forEach(function (k) {
            if (k.indexOf(prefix) !== 0) return;
            if (exact && k !== exact) return;
            api._gateAccessCache.delete(k);
        });
        return { ok: true };
    },

    // { gate } -> { ok, txHash, wrapped, approved } — pay one subscription
    // period (renewing early extends from the current end). WPOL-priced gates
    // wrap native POL to cover any shortfall first; then the gate is approved
    // for exactly `price` when the standing allowance is short (reset to 0
    // first — USDT-style tokens revert on non-zero → non-zero). Three txs
    // worst case, one when balance and allowance already cover it.
    async gatePay(a) {
        // Each on-chain step is announced to Kotlin so the loading toast can
        // narrate the flow (web parity: gateManager.pay's onStep) — worst
        // case three transactions with the user staring at one spinner.
        const progress = function (step) {
            try { Native.progress('gatePay', step); } catch (e) { /* shell without the hook */ }
        };
        const info = await api.gateInfo(a);
        const price = BigInt(info.price);
        const signer = api._gateSigner();
        const token = new window.ethers.Contract(info.token, api._GATE_TOKEN_ABI, signer);
        var wrapped = false, approved = false;

        if (info.token === api._WRAPPED_NATIVE) {
            const balance = await token.balanceOf(signer.address);
            if (balance < price) {
                const shortfall = price - balance;
                const native = await signer.provider.getBalance(signer.address);
                if (native <= shortfall) throw new Error('Not enough POL to cover the subscription price');
                progress('wrap');
                const wrapper = new window.ethers.Contract(info.token, api._WRAPPED_NATIVE_ABI, signer);
                const wrapTx = await wrapper.deposit({ value: shortfall });
                await wrapTx.wait();
                wrapped = true;
            }
        }

        const allowance = await token.allowance(signer.address, a.gate);
        if (allowance < price) {
            progress('approve');
            if (allowance > 0n) {
                const resetTx = await token.approve(a.gate, 0n);
                await resetTx.wait();
            }
            const approveTx = await token.approve(a.gate, price);
            await approveTx.wait();
            approved = true;
        }

        progress('pay');
        const result = await api._gateTx(a.gate, 'pay', []);
        result.wrapped = wrapped;
        result.approved = approved;
        return result;
    }
};

// Generic RPC: Kotlin -> bridgeCall(id, method, argsB64) -> Native.result(id, ok, payloadB64)
window.bridgeCall = function (id, method, argsB64) {
    Promise.resolve().then(async function () {
        const args = argsB64 ? JSON.parse(b64ToUtf8(argsB64)) : {};
        const fn = api[method];
        if (!fn) throw new Error('unknown method: ' + method);
        const value = await fn(args);
        Native.result(id, true, utf8ToB64(JSON.stringify(value === undefined ? {} : value)));
    }).catch(function (e) {
        const msg = (e && e.message) ? e.message : String(e);
        Native.result(id, false, utf8ToB64(JSON.stringify({ error: msg })));
    });
};

// Binary publish (file pieces on -2/P2). Deliberately NOT routed through
// bridgeCall: that path base64s the whole args JSON, so a payload that is
// already base64 would be encoded twice and a 240 KB piece would cross the
// bridge as ~427 KB. Here only the small {streamId,partition} envelope pays
// the double encoding and the payload carries a single base64 layer.
//
// Resolves through the same Native.result(id, …) plumbing as bridgeCall, so
// Kotlin can await a publish (needed for send-slot accounting) with no extra
// machinery — unlike PomboTV, which is fire-and-forget plus a separate ack.
//
// Also deliberately NOT joined to `pubChains`: pieces are self-describing
// (fileId + index live in the payload header), so ordering is irrelevant, and
// chaining would serialise sends and cap throughput at one publish in flight.
// The web publishes pieces concurrently under its own send-slot limiter.
//
// The payload is published as a bare Uint8Array with no contentType option —
// exactly what web streamr.js publish() does with the same vendor bundle. The
// PomboTV POC passes { contentType: 'binary' }, but matching the web is what
// keeps pieces readable by web clients.
window.bridgePublishBinary = function (id, argsB64, dataB64) {
    Promise.resolve().then(async function () {
        if (!client) throw new Error('client not connected');
        const a = JSON.parse(b64ToUtf8(argsB64));
        let bytes = b64ToU8(dataB64);
        // Pre-framed piece from Kotlin (0x02 sealed DM or 0x03 channel frame
        // with the native proof — SealedSenderCrypto/ChannelIdentities): the
        // page only password-seals if asked (PBKDF2 stays in BoringSSL) and
        // publishes under the given throwaway identity. No key material read.
        if (a.identityPk) {
            if (a.password) bytes = await pwEncryptBinary(bytes, String(a.password));
            const identityI = window.EthereumKeyPairIdentity.fromPrivateKey(a.identityPk);
            await api._publishAs(identityI, a.streamId, a.partition, bytes);
            Native.result(id, true, utf8ToB64(JSON.stringify({ ok: true, bytes: bytes.length })));
            return;
        }
        // Gated channel piece: the bytes arrive already sealed with the epoch
        // key in Kotlin (0x04) and ride the CLONE (ERC-1271) — an ephemeral
        // key holds no grant, and client.publish would re-wrap a members-only
        // stream in the SDK's group-key AES.
        if (a.gateAddress) {
            if (!wallet) throw new Error('no identity');
            const st = window.SignatureType;
            if (!st || st.ERC_1271 == null) {
                throw new Error('SignatureType.ERC_1271 not exposed — refresh pombo-vendor.bundle.js');
            }
            const identity = nativeIdentity;
            await api._publishAs(identity, a.streamId, a.partition, bytes, {
                publisherId: String(a.gateAddress).toLowerCase(),
                signatureType: st.ERC_1271
            });
            Native.result(id, true, utf8ToB64(JSON.stringify({ ok: true, bytes: bytes.length })));
            return;
        }
        // Encrypted here for the same reason it is decrypted here: PBKDF2 in
        // BoringSSL rather than Bouncy Castle. The password never leaves the
        // WebView on this path — Kotlin hands over plaintext bytes.
        if (a.password) bytes = await pwEncryptBinary(bytes, String(a.password));
        await client.publish({ streamId: a.streamId, partition: a.partition }, bytes);
        Native.result(id, true, utf8ToB64(JSON.stringify({ ok: true, bytes: bytes.length })));
    }).catch(function (e) {
        const msg = (e && e.message) ? e.message : String(e);
        Native.result(id, false, utf8ToB64(JSON.stringify({ error: msg })));
    });
};

// Storage-file chunk publish (message stream -1 chunk partitions, Persistent
// File Sharing). Distinct from bridgePublishBinary on two counts:
//
//  1. It publishes with { contentType: 'binary' } — exactly what web
//     streamr.js publishStorageChunk does. The storage node then stores the row
//     as contentType 1 (binary), which the HTTP range reader hex-decodes on
//     download; a bare Uint8Array publish (the mesh path) would not round-trip
//     through the node's HTTP API the same way.
//  2. It RETURNS THE PUBLISH TIMESTAMP. Upload verify matches published chunks
//     to stored rows by timestamp (never content — that works on sealed rows
//     too), so the caller must learn each chunk's assigned timestamp.
//
// NO crypto here: storage chunks are sealed natively in Kotlin (one PBKDF2 per
// FILE via PomboCrypto, then per-chunk AES-GCM), so the bytes that cross are
// already ciphertext (or plaintext for public channels). The bridge just
// publishes them. Also NOT joined to pubChains: chunks are self-describing
// (transferId + index in the header) so ordering is irrelevant, and chaining
// would cap in-flight publishes at one.
window.bridgePublishStorageChunk = function (id, argsB64, dataB64) {
    Promise.resolve().then(async function () {
        if (!client) throw new Error('client not connected');
        const a = JSON.parse(b64ToUtf8(argsB64));
        let bytes = b64ToU8(dataB64);
        // Pre-sealed chunk from Kotlin under a natively-minted identity (DM
        // per-transfer key or channel pseudonym): just publish and return the
        // network timestamp — upload verify matches rows by it.
        if (a.identityPk) {
            const identityI = window.EthereumKeyPairIdentity.fromPrivateKey(a.identityPk);
            const msgI = await api._publishAs(identityI, a.streamId, a.partition, bytes);
            Native.result(id, true, utf8ToB64(JSON.stringify(
                { ok: true, bytes: bytes.length, timestamp: msgI.timestamp })));
            return;
        }
        // Gated channel chunk: already epoch-sealed in Kotlin (0x04).
        // publishAs sends encryptionType NONE — client.publish on a
        // members-only stream would re-wrap it in the SDK's group-key AES and
        // break the HTTP hex reader. Rides the clone (ERC-1271).
        if (a.gateAddress) {
            if (!wallet) throw new Error('no identity');
            const st = window.SignatureType;
            if (!st || st.ERC_1271 == null) {
                throw new Error('SignatureType.ERC_1271 not exposed — refresh pombo-vendor.bundle.js');
            }
            const identity = nativeIdentity;
            const msg4 = await api._publishAs(identity, a.streamId, a.partition, bytes, {
                publisherId: String(a.gateAddress).toLowerCase(),
                signatureType: st.ERC_1271
            });
            Native.result(id, true, utf8ToB64(JSON.stringify(
                { ok: true, bytes: bytes.length, timestamp: msg4.timestamp })));
            return;
        }
        const msg = await client.publish(
            { streamId: a.streamId, partition: a.partition },
            bytes,
            { contentType: 'binary' }
        );
        // The SDK publish result carries the assigned timestamp; shapes vary
        // across versions, so fall back defensively (Date.now() last).
        var ts = null;
        if (msg && typeof msg.timestamp === 'number') ts = msg.timestamp;
        else if (msg && msg.streamMessage && typeof msg.streamMessage.getTimestamp === 'function') ts = msg.streamMessage.getTimestamp();
        else if (msg && typeof msg.getTimestamp === 'function') ts = msg.getTimestamp();
        if (typeof ts !== 'number') ts = Date.now();
        Native.result(id, true, utf8ToB64(JSON.stringify({ ok: true, bytes: bytes.length, timestamp: ts })));
    }).catch(function (e) {
        const msg = (e && e.message) ? e.message : String(e);
        Native.result(id, false, utf8ToB64(JSON.stringify({ error: msg })));
    });
};

// Ethers Signer that signs through the native oracle. Transactions go to
// Native.signTransactionPayload (RLP shape check + ChainGuard window on the
// Kotlin side); messages to Native.signMessagePayload (EIP-191 applied
// natively). Used by _gateWallet and by the SDK's registry writes via
// nativeIdentity.getTransactionSigner.
class NativeSigner extends window.ethers.AbstractSigner {
    connect(provider) { return new NativeSigner(provider); }
    get address() { return BRIDGE_ADDRESS; }
    async getAddress() { return BRIDGE_ADDRESS; }
    async signTransaction(txReq) {
        // AbstractSigner.sendTransaction hands us a Transaction INSTANCE (it
        // already did `delete pop.from; Transaction.from(pop)`). Its fields are
        // prototype getters, so Object.assign would copy nothing and we would
        // sign an empty tx. Use the instance directly; only build from a plain
        // request on the (unused) direct-call path.
        const tx = (txReq instanceof window.ethers.Transaction)
            ? txReq
            : (function () { const r = Object.assign({}, txReq); delete r.from; return window.ethers.Transaction.from(r); })();
        const sig = Native.signTransactionPayload(tx.unsignedSerialized);
        if (!sig) throw new Error('Transaction not confirmed');
        tx.signature = window.ethers.Signature.from(sig);
        return tx.serialized;
    }
    async signMessage(message) {
        const bytes = typeof message === 'string'
            ? window.ethers.toUtf8Bytes(message) : new Uint8Array(message);
        const sig = Native.signMessagePayload(u8ToB64(bytes));
        if (!sig) throw new Error('no identity');
        return sig;
    }
    async signTypedData() { throw new Error('signTypedData is not supported'); }
}

// Streamr Identity that delegates createMessageSignature to the native
// oracle — the SDK awaits it (vendor MessageSigner:
// `await identity.createMessageSignature`), so the sync JS→Kotlin hop just
// resolves immediately.
const nativeIdentity = {
    // Mirror the SDK's KeyPairIdentity exactly: getUserId → lowercase hex
    // string, getUserIdRaw → bytes. Swapping these makes the namespace check
    // reject every stream ("not a valid Ethereum address" on create).
    getUserId: async function () { return BRIDGE_ADDRESS.toLowerCase(); },
    getUserIdRaw: async function () { return window.ethers.getBytes(BRIDGE_ADDRESS); },
    getSignatureType: function () { return window.SignatureType.ECDSA_SECP256K1_EVM; },
    createMessageSignature: async function (payload) {
        const sig = Native.signMessagePayload(u8ToB64(payload));
        if (!sig) throw new Error('native signer refused');
        return window.ethers.getBytes(sig);
    },
    getTransactionSigner: async function (rpcProviderSource) {
        return new NativeSigner(rpcProviderSource.getProvider());
    }
};

async function boot() {
    try {
        if (!window.StreamrClient || !window.ethers) {
            Native.error('vendor bundle failed to load');
            return;
        }
        // No identity: ethers-only operations (create/import wallet).
        if (!BRIDGE_ADDRESS || BRIDGE_ADDRESS.indexOf('__') === 0) {
            Native.status('no-identity');
            return;
        }
        const stBoot = window.SignatureType;
        if (!stBoot || stBoot.ECDSA_SECP256K1_EVM == null) {
            Native.error('SignatureType.ECDSA_SECP256K1_EVM not exposed — refresh pombo-vendor.bundle.js');
            return;
        }
        wallet = { address: BRIDGE_ADDRESS, publicKey: BRIDGE_PUBKEY };
        Native.status('connecting');
        // Config identical to the web streamr.js init(), except auth: the key
        // stays in Kotlin and the SDK signs through nativeIdentity.
        client = new window.StreamrClient({
            auth: { identity: nativeIdentity },
            // Without this the SDK publishes node telemetry every minute to
            // streamr.eth/metrics/nodes/firehose/*, signed with the REAL
            // account (auth.privateKey does not count as auth.ethereum, so the
            // SDK default keeps the metrics periods). Web P0.1 equivalent.
            metrics: false,
            // Pombo publishes NOTHING under the SDK's group-key AES any more
            // (DMs/channels/admin all seal at the app layer and ship NONE).
            // The only SDK-encrypted rows left are legacy history and foreign
            // streams, and each one used to cost the DEFAULT 30s key-request
            // timeout inside a resend drain — a native channel open stalled
            // 20s+ on unreadable legacy ADMIN_STATE rows. Fail those fast.
            encryption: { keyRequestTimeout: 3000 },
            network: {
                controlLayer: {
                    maxMessageSize: 1048576,
                    webrtcDatachannelBufferThresholdLow: 65536,
                    webrtcDatachannelBufferThresholdHigh: 262144
                }
            },
            contracts: {
                ethereumNetwork: { chainId: 137, highGasPriceStrategy: false },
                rpcs: RPCS,
                rpcQuorum: 1
            },
            // Deliberate divergence from the web (SDK default 30s): a member
            // who is OFFLINE makes every history message sealed with their key
            // wait out this timeout serially during a resend drain — two such
            // messages ate an entire page budget and the room rendered empty.
            // Real exchanges measured 2-8s; 10s keeps those while capping the
            // dead-key cost per message.
            encryption: { keyRequestTimeout: 10000 }
        });
        const addr = await client.getAddress();
        Native.connected(addr);
    } catch (e) {
        Native.error('boot: ' + ((e && e.message) ? e.message : String(e)));
    }
}
boot();
</script>
